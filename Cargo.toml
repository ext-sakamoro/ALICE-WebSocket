[package]
name = "alice-websocket"
version = "3.0.0"
edition = "2021"
authors = ["Moroya Sakamoto <sakamoro@alicelaw.net>"]
license = "LicenseRef-Proprietary"
publish = false
description = "Pure Rust WebSocket protocol implementation — frame parsing, masking, handshake, ping/pong, close, fragmentation, text/binary, extensions"
repository = "https://github.com/ext-sakamoro/ALICE-WebSocket"
keywords = ["websocket", "rfc6455", "protocol", "framing", "network"]
categories = ["network-programming", "web-programming", "parser-implementations"]

[lib]
crate-type = ["rlib"]

[features]
default = []
# OsMask: mask and handshake keys from the operating system's random source (alice-crypto `random::fill`)
rng = ["dep:alice-crypto"]
# client::connect_tls: wss over rustls 0.23 (ring provider, TLS 1.2 + 1.3), Mozilla roots from webpki-roots
# or caller-supplied roots
tls = ["dep:rustls", "dep:webpki-roots"]

[dependencies]
# crates.io has alice-crypto only up to 0.4; 0.7 comes from the git main branch (as in the other ALICE crates).
# `rng` alone: the OS random source without the AEAD / KDF / hash dependencies
alice-crypto = { version = "0.7", git = "https://github.com/ext-sakamoro/ALICE-Crypto", branch = "main", optional = true, default-features = false, features = ["rng"] }
# ring provider (no cmake / NASM build); no `logging` so `log` is not linked
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = { version = "1", optional = true }

[dev-dependencies]
# a test-only certificate generated at test time (no key material in the repository)
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }

[package.metadata.docs.rs]
all-features = true
