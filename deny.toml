# cargo-deny 設定 (v0.14+ schema)
# https://embarkstudios.github.io/cargo-deny/
#
# ALICE-Analytics の deny.toml を base に ALICE-WebSocket 用に調整 (依存 0 crate、2026-09-17; 1.1.0 から optional の alice-crypto / rustls / webpki-roots)

[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

# ---------------------------------------------------------------------------
# Advisories (RustSec CVE + yanked)
# ---------------------------------------------------------------------------
[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
version = 2
yanked = "deny"
ignore = []

# ---------------------------------------------------------------------------
# Licenses (allow-list 方式)
# ---------------------------------------------------------------------------
[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "0BSD",
    "BSL-1.0",
    "MPL-2.0",
    "OpenSSL",
    # webpki-roots (feature `tls`): the Mozilla root program data; a permissive data licence with
    # no copyleft or notice-in-binary obligation beyond keeping the licence text
    "CDLA-Permissive-2.0",
]

# 本 crate 自身は LicenseRef-Proprietary (allow-list 外) なので自己 exception
[[licenses.exceptions]]
allow = ["LicenseRef-Proprietary"]
name = "alice-websocket"

# alice-crypto (feature `rng`, the OS random source) is an ALICE crate under the same proprietary licence
[[licenses.exceptions]]
allow = ["LicenseRef-Proprietary"]
name = "alice-crypto"

# ---------------------------------------------------------------------------
# Bans (banned crate / duplicate / wildcard)
# ---------------------------------------------------------------------------
[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

deny = []
skip = []
skip-tree = []

# ---------------------------------------------------------------------------
# Sources
# ---------------------------------------------------------------------------
[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# alice-crypto 0.7 is not on crates.io; it comes from its repository's main branch (Cargo.lock pins the commit)
allow-git = ["https://github.com/ext-sakamoro/ALICE-Crypto"]
