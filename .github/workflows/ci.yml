name: CI

# optional 依存 (rng: alice-crypto / tls: rustls + webpki-roots) を持つ crate 向け、feature 組ごとに clippy / test / doc
# 2026-09-17 展開: それまで fmt + actionlint のみで test / clippy が CI に無かった
# (strict-eval 5、protocol 1.0.x 12 crate) toolchain は rust-toolchain.toml の pin

on:
  push:
    branches: [main, 'ci/**']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTDOCFLAGS: "-D warnings"

jobs:
  test:
    name: Test + Clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (pedantic、all targets、all features)
        run: cargo clippy --all-targets --all-features -- -W clippy::pedantic -D warnings

      - name: Test
        run: cargo test --all-features

      - name: Doc (-D warnings)
        run: cargo doc --no-deps --all-features

      # each optional feature on its own: --all-features hides a module that only compiles
      # because another feature pulled in a dependency
      - name: Clippy + Test per feature set (none / rng / tls)
        run: |
          set -euo pipefail
          for f in "--no-default-features" "--no-default-features --features rng" "--no-default-features --features tls"; do
            echo "== $f"
            # shellcheck disable=SC2086
            cargo clippy --all-targets $f -- -W clippy::pedantic -D warnings
            # shellcheck disable=SC2086
            cargo test $f
          done

      - name: Doc per feature set (-D warnings)
        run: |
          set -euo pipefail
          for f in "--no-default-features" "--no-default-features --features rng" "--no-default-features --features tls"; do
            echo "== $f"
            # shellcheck disable=SC2086
            cargo doc --no-deps $f
          done

  actionlint:
    name: actionlint (workflow YAML 検証)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          fail_level: error
          reporter: github-check
