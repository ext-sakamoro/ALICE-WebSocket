name: Security & Hygiene

# canonical CI template ([[reference_alice_ci_canonical_template]]) の依存 0 crate 向け
# (sibling stub なし、coverage job なし) 2026-09-17 展開
#
# 目的:
# - RustSec advisory (CVE) の週次検知
# - dep license 逸脱 (GPL 侵入等) の block
# - 未使用依存の炙り出し
# - 仮実装 (todo! / unimplemented! / panic!(STUB) / dbg!) の CI gate

on:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/**'
      - 'deny.toml'
      - '.github/workflows/security-audit.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/**'
      - 'deny.toml'
      - '.github/workflows/security-audit.yml'
  schedule:
    # 毎週月曜 09:00 UTC = 18:00 JST
    - cron: '0 9 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "5"
  CARGO_HTTP_MULTIPLEXING: "false"

jobs:
  audit:
    name: cargo audit (RustSec CVE scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        run: cargo audit --deny yanked

  deny:
    name: cargo-deny (license + advisories + bans + sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-deny
        run: cargo install --locked cargo-deny

      - name: Run cargo deny check all
        run: cargo deny --all-features check all

  unused-deps:
    name: cargo-machete (unused dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # false-positive は Cargo.toml の [package.metadata.cargo-machete] ignored で除外
      - uses: bnjbvr/cargo-machete@main

  stub-guard:
    name: Stub / mock / dbg guard (grep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Detect panic!(STUB) / dbg!() in src/** (block)
        run: |
          set -euo pipefail
          hits=$(grep -rnE 'panic!\("STUB|dbg!\(' src/ || true)
          if [ -n "$hits" ]; then
            echo "::error::panic!(STUB) / dbg!() found in src/:"
            echo "$hits"
            exit 1
          fi
          echo "no panic!(STUB) / dbg!() in src/"

      - name: Detect todo!() / unimplemented!() in src/** (informational)
        run: |
          hits=$(grep -rnE 'todo!\(|unimplemented!\(' src/ || true)
          if [ -n "$hits" ]; then
            echo "::warning::todo!() / unimplemented!() found in src/ (fail fast は OK、残置は Backlog へ):"
            echo "$hits"
          fi

      - name: Detect TODO / FIXME / XXX / HACK (informational)
        run: |
          hits=$(grep -rnE '\b(TODO|FIXME|XXX|HACK)\b' src/ || true)
          if [ -n "$hits" ]; then
            echo "::warning::TODO / FIXME / XXX / HACK found in src/:"
            echo "$hits"
          fi

  semver-checks:
    name: cargo-semver-checks (API compat、informational)
    runs-on: ubuntu-latest
    # informational only (計画的 API 変更を block しない)
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # baseline-rev 比較のため full history 必要
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # version 明示 pin: `@latest` は rustc MSRV を追いかける (0.50.0 = 1.93+) ので、
      # rust-toolchain.toml の pin と一緒に月次で bump する
      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks@0.50.0

      # HEAD~1 と比較 (informational、break あっても block しない)
      - name: Run cargo semver-checks
        run: |
          cargo semver-checks check-release \
            --package alice-websocket \
            --baseline-rev "HEAD~1" \
            || true
